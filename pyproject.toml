[project]
name = "django-wide-events"
version = "0.1.0"
description = "One wide event per Django request: canonical log lines built from pluggable collectors and blocks."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "moonlitmarigold", email = "moonlitmarigold12@gmail.com" }
]
keywords = ["django", "logging", "wide events", "canonical log lines", "observability", "structured logging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Logging",
]
dependencies = [
    "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/moonlitmarigold/django-wide-events"
Repository = "https://github.com/moonlitmarigold/django-wide-events"
Issues = "https://github.com/moonlitmarigold/django-wide-events/issues"
Documentation = "https://github.com/moonlitmarigold/django-wide-events/tree/main/docs"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "django_wide_events"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

# Capture everything; shown automatically in the "captured log" section of failures.
log_level = "DEBUG"
log_format = "%(levelname)-8s %(name)s: %(message)s"
log_date_format = "%H:%M:%S"

# Live logs on: without this, logs print only for FAILING tests.
# Quiet a run with:  -o log_cli=false
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(levelname)-8s %(name)s: %(message)s"
